name: pulse_money
description: Premium offline-first AI expense tracker. Your data, completely private.
publish_to: 'none'
version: 1.0.0
environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.0.0
  go_router: ^7.0.0

  drift: ^2.4.0
  path: ^1.9.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.0.0

  google_fonts: ^4.0.3
  fl_chart: ^0.69.0
  table_calendar: ^3.1.2
  intl: ^0.20.2

  uuid: ^3.0.6
  permission_handler: ^11.3.1
  share_plus: ^10.0.2
  excel: ^4.0.6
  file_picker: ^8.1.2
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^0.3.0
  build_runner: ^2.3.0
  drift_dev: ^2.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - test/fixtures/
flutter_icons:
  android: true
  ios: true
  image_path: assets/images/app-logo.png
  # Use a solid background color for adaptive icon so the image appears to
  # cover the full area. If your image has transparent padding, the background
  # color will fill it. You can change this to any hex color (e.g. '#FFFFFF').
  android_adaptive_icon_background: '#FFFFFF'
